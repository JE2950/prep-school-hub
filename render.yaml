databases:
  - name: prep-school-hub-db
    plan: free
    databaseName: prep_school_hub
    user: prep_school_hub

services:
  - type: web
    name: prep-school-hub
    runtime: node
    plan: free
    rootDir: .
    # NODE_ENV=production (below) makes plain `npm install` skip devDependencies —
    # but vite, typescript and the prisma CLI are devDependencies needed to build,
    # so --include=dev forces them in for this step regardless.
    buildCommand: >-
      cd client && npm install --include=dev && npm run build &&
      cd ../server && npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: prep-school-hub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
