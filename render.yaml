databases:
  - name: prep-school-hub-db
    plan: free
    databaseName: prep_school_hub
    user: prep_school_hub

services:
  - type: web
    name: prep-school-hub
    runtime: node
    plan: free
    rootDir: .
    buildCommand: >-
      cd client && npm install && npm run build &&
      cd ../server && npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: prep-school-hub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
